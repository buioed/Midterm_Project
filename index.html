<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <!-- 구글 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./style/reset.css" />

    <link rel="stylesheet" href="./style/style_screen1.css" />

    <script src="./js/script.js" defer></script>

  <body>
    <div class="stage">
      <!-- 화면 1 : 포스터 -->
      <div class="poster-screen">
        <!-- 배경 -->
        <img src="./image/background.jpeg" class="bg-img" />

        <!-- 흔들리는 나뭇잎 6장 -->

          <path d="M605.866 323.023L645.366 254.607" />

        <svg class="rain rain-3" viewBox="0 0 752 491">
          <path d="M722.494 212.617L777.868 116.708" />
          <path d="M467.706 347.606L523.079 251.696" />

        <!-- 마우스 빛 -->
        <div class="cursor-light"></div>

        <!-- 구두 클릭 : 빛 + 퍼지는 물결 + 안내 문구, 누르면 화면 전환 -->
        <div class="shoes">
          <div class="glow"></div>
          <div class="ring"></div>
          <p class="hint">구두를 눌러보세요</p>
        </div>
      </div>

      <!-- 화면 2 : 하늘에서 본 정원 -->
      <div class="park-screen">
        <!-- 정원 사진 -->
        <img src="./image/park.jpg" class="park-img" />

        <!-- 햇빛 -->
        <div class="sun"></div>

        <!-- 무지개 : 햇빛을 누르면 왼쪽 아래에서 오른쪽 위로 퍼짐 -->
        <svg class="rainbow" viewBox="0 0 600 400">
          <path class="r1" d="M 0 340 L 600 -60" />
          <path class="r2" d="M 0 348 L 600 -52" />
          <path class="r3" d="M 0 356 L 600 -44" />
          <path class="r4" d="M 0 364 L 600 -36" />
          <path class="r5" d="M 0 372 L 600 -28" />
          <path class="r6" d="M 0 380 L 600 -20" />
        </svg>

        <!-- 제목 -->
        <h1 class="title">언<br />어<br />의<br /><br />정<br />원</h1>

        <!-- 제목 왼쪽에 세로로 이어지는 시-->
        <!-- br로 계속 띄워 적용 가능한 코드지만, 너무 코드가 길어져서 서치 후 writing-mode를 활용해서 작성-->
        <p class="poem">
          천둥소리가 희미하게 울리고<br />
          비가 오지 않아도<br />
          나는 여기 있겠어요<br />
          당신이 붙잡는다면
        </p>

        <!-- 영문 제목 : 왼쪽 위 -->
        <p class="en-title">THE GARDEN OF WORDS</p>

        <!-- 카피 : 가로로, "사랑" · "고독과 슬픔" 만 핑크 -->
        <p class="copy">
          <span class="pink">“사랑”</span>보다 더 오래된,<br />
          <span class="pink">“고독과 슬픔”</span>에 관한 이야기
        </p>
        <!-- 크레딧 : 맨 아래 3줄 -->
        <p class="meta">
          2013. 05. 31 · 46min<br />
          감독 · 각본 신카이 마코토 | 아키즈키 타카오 · 유키노 유카리<br />
          ©Makoto Shinkai / CoMix Wave Films
        </p>

        <!-- 누르면 다시 비 오는 포스터로 -->
        <p class="back">↺ 다시 비 내리기</p>

</html>
